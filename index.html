<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Hyro Vision — AI-powered software, custom vision systems, and enterprise platforms engineered to perform at scale." />
    <meta name="theme-color" content="#0a0a0a" />

    <!-- Favicon Assets -->
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="shortcut icon" href="/favicon.ico" />
    <meta property="og:image" content="/assets/hyro-logo-dark.png" />

    <!-- DNS Prefetch & Preconnect for High-Speed Asset Resolution -->
    <link rel="dns-prefetch" href="https://fonts.googleapis.com" />
    <link rel="dns-prefetch" href="https://fonts.gstatic.com" />
    <link rel="dns-prefetch" href="https://images.unsplash.com" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <!-- Preload Critical Above-The-Fold Brand Assets -->
    <link rel="preload" href="/assets/hyro-logo-mark.png" as="image" type="image/png" fetchpriority="high" />

    <!-- Non-Render-Blocking Web Font Loading (Inter + Space Grotesk + Instrument Serif) -->
    <link
      rel="preload"
      as="style"
      href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;700&display=swap"
    />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;700&display=swap"
      media="print"
      onload="this.media='all'"
    />
    <noscript>
      <link
        rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;700&display=swap"
      />
    </noscript>

    <title>Hyro Vision — Intelligent Digital Experiences</title>
  </head>
  <body style="margin: 0; padding: 0; background: #0a0a0a;">
    <div id="root"></div>
    <script type="module" src="/main.jsx"></script>
  </body>
</html>
